# =============================================================================
#  LivingDesign — docker-compose (étape 2 : les bases de données)
# =============================================================================

name: livingdesign                

services:                          # la liste des conteneurs à lancer

  postgres:                        # nom du service (on peut l'appeler ainsi entre conteneurs)
    image: postgres:16             # image officielle, version 16
    env_file: .env                 # lit les variables (mots de passe…) depuis infra/.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volume nommé : les données survivent à l'arrêt du conteneur.
      - pg_data:/var/lib/postgresql/data
      - ../db/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:                   # Docker vérifie régulièrement que la base répond
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    environment:                   # variables attendues par l'image mongo
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD} 
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ../db/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ===========================================================================
  #  Volet 4 — temps réel : Kafka et le job Spark Structured Streaming
  # ===========================================================================
  kafka:
    image: apache/kafka:3.9.0      # image officielle, mode KRaft (pas besoin de ZooKeeper)
    ports:
      # 9094 = l'accès depuis ton PC (le producteur lancé avec uv).
      # Les conteneurs, eux, utilisent kafka:9092.
      - "${KAFKA_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller          # un seul nœud qui fait les deux rôles
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Trois "portes" : INTERNAL pour les conteneurs, EXTERNAL pour ton PC, CONTROLLER pour Kafka lui-même.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Un seul nœud : chaque donnée n'existe qu'en un exemplaire (en production : 3).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"        # les topics sont créés volontairement (par le producteur)
    # Pas de volume : les messages vivent tant que le conteneur existe (démo). Après un
    # "down", Kafka repart vide ; le job Spark le détecte et continue (failOnDataLoss=false).
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20

  spark-streaming:
    build: ../data-platform/streaming    # image construite à partir de data-platform/streaming/Dockerfile
    env_file: .env                       # ANALYTICS_DB_PASSWORD, POSTGRES_DB, ORDER_SPIKE_THRESHOLD…
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      POSTGRES_HOST: postgres
      CHECKPOINT_DIR: /checkpoints
    user: root                           # pour écrire dans le volume des checkpoints
    ports:
      - "4040:4040"                      # interface web de Spark : http://localhost:4040 (onglet Structured Streaming)
    volumes:
      # Le checkpoint vit dans un volume : il survit à l'arrêt du conteneur, c'est
      # ce qui permet de reprendre sans perte ni doublon.
      - spark_checkpoints:/checkpoints
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped              # redémarre tout seul après une erreur (ex. base pas encore prête)

volumes:                          
  pg_data:
  mongo_data:
  spark_checkpoints:
