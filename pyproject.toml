# =============================================================================
#  pyproject.toml — la carte d'identité du projet Python (standard PEP 621)
# =============================================================================
[project]
name = "livingdesign"
version = "0.1.0"
description = "Plateforme e-commerce de mobilier et décoration : outils data et remplissage des bases"
requires-python = ">=3.12"
dependencies = [
    "livingdesign-commons",         
    "pandas>=2.2",                  
    "psycopg[binary]>=3.2",         
    "pymongo>=4.8",                 
    "faker>=30.0",                  
]

# Outils de développement : installés chez nous, jamais dans les images Docker.
[dependency-groups]
dev = [
    "graphql-core>=3.3.2",
    "pytest>=8.3",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
]

[tool.uv.workspace]
members = ["libs/livingdesign_commons"]

# "livingdesign-commons" ne vient pas de PyPI mais du workspace (dossier libs/).
[tool.uv.sources]
livingdesign-commons = { workspace = true }

# ----------------------------------------------------------------------------
#  Réglages des outils
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 120                    # longueur maximale d'une ligne
target-version = "py312"

[tool.ruff.lint]
# E/F : erreurs et imports inutilisés, UP : syntaxe Python moderne, B : bugs probables.
# (On n'active pas le tri automatique des imports "I" : il supprimerait l'alignement
# des commentaires pédagogiques en fin de ligne.)
select = ["E", "F", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["libs", "data-platform", "tests"]   # où pytest cherche les tests
